name: openff-fragmenter-test

channels:
  - conda-forge
dependencies:
    # Core
  - python
  - setuptools
  - setuptools-scm
  - pydantic =2
  - jinja2

    # OpenFF stack
  - openff-toolkit-base >=0.14.4
  - rdkit

    # Wiberg bond orders (GFN2-xTB). Build >=4 of 6.7.1 fixes a Fortran
    # format-string crash (grimme-lab/xtb#1332).
  - xtb >=6.7.1

    # Testing
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-randomly
